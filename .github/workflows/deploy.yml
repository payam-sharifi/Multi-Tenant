name: Deploy Next.js to Server

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 5m
          script: |
            cd /easysitebuilder/Multi-Tenant
            git stash
            git pull 
            npm install 
            npm run build -- --webpack
            pm2 delete Multi-Tenant || true
            PORT=3001 pm2 start /easysitebuilder/Multi-Tenant/node_modules/next/dist/bin/next --name "Multi-Tenant" -- start
            pm2 save